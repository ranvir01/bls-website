[build]
  command = "NODE_ENV=production npm ci --no-audit --prefer-offline && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "18.17.0"
  NPM_VERSION = "10.8.2"
  NEXT_TELEMETRY_DISABLED = "1"
  NEXT_CACHE = "true"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Redirect all URLs to the app
[[redirects]]
  from = "/*"
  to = "/"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self' 'unsafe-inline' 'unsafe-eval' *.imgur.com data: blob:; img-src 'self' data: blob: *.imgur.com; frame-ancestors 'none';"