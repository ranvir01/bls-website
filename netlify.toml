[build]
  command = "npm run build"
  publish = ".next"
  environment = { NODE_VERSION = "18.17.0", NPM_VERSION = "10.8.2" }

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Handle client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self' 'unsafe-inline' 'unsafe-eval' *.imgur.com data: blob:; img-src 'self' data: blob: *.imgur.com; frame-ancestors 'none';"