<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Section</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        .hero-container {
            position: relative;
            width: 100%;
            height: 100vh;
            background-image: linear-gradient(to bottom, rgba(0,0,0,0.7), rgba(0,0,0,0.3)), url('/images/hero-home.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), rgba(0,0,0,0.75), transparent);
        }
        .content {
            position: relative;
            z-index: 10;
            max-width: 800px;
            padding: 0 20px;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }
        p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            text-shadow: 0 1px 4px rgba(0,0,0,0.4);
        }
        .blue {
            color: #93c5fd;
        }
    </style>
</head>
<body>
    <div class="hero-container">
        <div class="overlay"></div>
        <div class="content">
            <h1>Expert Landscaping & Hardscaping in <span class="blue">Seattle</span></h1>
            <p>Transform your outdoor space with our premium landscaping services. Specializing in retaining walls, custom patios, and professional irrigation systems.</p>
        </div>
    </div>
</body>
</html>
